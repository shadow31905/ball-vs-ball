<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Ball VS Ball 2.5 — Menu standardowe (beta)</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030916}
#game-frame{display:block;width:100%;height:100%;border:0}
#loading{position:fixed;inset:0;z-index:5;background:radial-gradient(circle at 50% 38%,#123b7a,#050b1d 68%);color:#e8f4ff;font:700 17px system-ui;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}
#loading[hidden]{display:none!important}
</style></head><body>
<div id="loading" role="status">Ball VS Ball 2.5 · Ładowanie menu testowego...</div>
<iframe id="game-frame" title="Ball VS Ball 2.5 – wersja testowa" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen"></iframe>
<script>
(()=>{'use strict';
 const frame=document.getElementById('game-frame'),loading=document.getElementById('loading');
 const q=new URLSearchParams(location.search);
 const mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
 const safe=q.get('lite')==='1'||(mobile&&q.get('full')!=='1');
 const target=new URL(safe?'../index-safe.html?v=20261105-menu25':'../?full=1',location.href);
 const skin=new URL('./skin.js?v=20261105-2',location.href).href;
 let attached=null;
 function attach(){
  try{
   const doc=frame.contentDocument;
   if(!doc?.body||!doc.getElementById('menu'))return;
   if(doc===attached&&doc.getElementById('bvb25-home')){loading.hidden=true;return}
   if(doc.querySelector('script[data-bvb25]'))return;
   const script=doc.createElement('script');script.src=skin;script.dataset.bvb25='';
   script.onload=()=>{attached=doc;loading.hidden=true};
   script.onerror=()=>{loading.textContent='Błąd ładowania menu beta. Odśwież stronę.'};
   doc.body.append(script);
  }catch(e){loading.textContent='Przeglądarka blokuje dostęp do testowej gry.'}
 }
 frame.src=target.href;
 frame.addEventListener('load',attach);
 const interval=setInterval(attach,700);
 addEventListener('pagehide',()=>clearInterval(interval),{once:true});
})();
</script></body></html>
