const mqLen=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return o};

function mqLink(url,topic,onmsg,onstate){

 L.pub=txt=>{if(L.ok)send(mqPkt(0x30,[...mqStr(topic),...mqEnc(txt)]))};
 const parse=()=>{for(;;){const b=L.buf;if(b.length<2)return;let i=1,len=0,mul=1,x;
   do{if(i>=b.length)return;x=b[i++];len+=(x&127)*mul;mul*=128}while((x&128)&&mul<=2097152);

   else if(t==9){if(body.length>=3&&body[2]!=128&&!L.ok){L.ok=1;onstate()}}

const rtcB64e=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const rtcB64d=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function rtcPipe(u,x){const w=x.writable.getWriter();w.write(u);w.close();return new Uint8Array(await new Response(x.readable).arrayBuffer())}
async function rtcEnc(type,sdp){const u=new TextEncoder().encode(sdp);if(typeof CompressionStream!='undefined')return type+'z'+rtcB64e(await rtcPipe(u,new CompressionStream('deflate-raw')));return type+'r'+rtcB64e(u)}
async function rtcDec(code,type){code=String(code||'').replace(/\s+/g,'');if(code[0]!==type||code.length<20||code.length>20000)throw 0;const u=rtcB64d(code.slice(2));const r=code[1]=='z'?await rtcPipe(u,new DecompressionStream('deflate-raw')):u;const sdp=new TextDecoder().decode(r);if(sdp.indexOf('v=0')!==0)throw 0;return sdp}

function mpRender(dt){
 if(!G||G.m!=8||G.ph!='battle'||HOST())return;
 const e=Math.min(MPS.snapInt,(performance.now()-MPS.snapRx)/1000);
 for(let i=0;i<2;i++){const o=G.bl[i];if(!o)continue;
  const r=MPS.rbl[i]||(MPS.rbl[i]={x:o.x,y:o.y,sd:0});
  const pad=26,lo=pad,hi=W-pad;
  const ddx=Number.isFinite(o.dirx)?o.dirx:0,ddy=Number.isFinite(o.diry)?o.diry:0,ssp=Number.isFinite(o.spd)?o.spd:0;
  let tx=o.x+ddx*ssp*e,ty=o.y+ddy*ssp*e;
  if(tx<lo)tx=2*lo-tx;else if(tx>hi)tx=2*hi-tx;
  if(ty<lo)ty=2*lo-ty;else if(ty>hi)ty=2*hi-ty;
  tx=Math.min(hi,Math.max(lo,tx));ty=Math.min(hi,Math.max(lo,ty));
  if(!r.sd){r.x=o.x;r.y=o.y;r.sd=1}
  else if(Math.hypot(tx-r.x,ty-r.y)>130){r.x=tx;r.y=ty}
  else{const k=Math.min(1,dt*28);r.x+=(tx-r.x)*k;r.y+=(ty-r.y)*k}
  o.x=Math.min(hi,Math.max(lo,r.x));o.y=Math.min(hi,Math.max(lo,r.y));o.vx=o.dirx;o.vy=o.diry;o.hc=0;o.lt=0;o.bs=0;
  o.an=(o.an||0)+(o.b.id==1?7:o.b.id==16?2.2:o.b.id==25?5:o.b.id==69?4:o.b.id==71?2.4:0)*dt}
 for(const p of G.pr){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60}
 for(const h of (G.hz||[]))if(h.t=='spike'){const ph=(G.rt+h.c0)%4;h.on=ph>3.3;h.wn=ph>2.4&&!(ph>3.3)}}

function mpLeaveNet(){MPS.connected=0;clearInterval(MPS.pi);clearInterval(MPS.hiT);clearInterval(MPS.ofT);clearTimeout(MPS.warnT);clearTimeout(MPS.waitT);MAN.on=0;

 MPS.code='';MPS.in={};MPS.fired=0;MPS.ended=0;MPS.n=0;MPS.peerId=''}
function mpLink(code){const o=(location.protocol=='http:'||location.protocol=='https:')?location.origin+location.pathname:'';
 return (o||'https://TWOJ-ADRES/ball-vs-ball.html')+'?room='+code}
function mpWaitPanel(code,msg){code=String(code||'').replace(/[^a-z0-9]/gi,'').slice(0,12);if(!code)return;show('pn');
 document.querySelector('#pb').innerHTML='<h2>\u{1F310} Pokoj \u201e'+code+'\u201d</h2><div class=cd>'+
 '<p>Bez konta. Wyslij koledze link albo podaj mu kod pokoju \u2014 oboje musicie miec te sama gre online.</p>'+
 '<input id=mc maxlength=12 value="'+code.toUpperCase()+'" style="font-size:20px;padding:8px;border-radius:10px;width:100%;box-sizing:border-box;text-align:center;text-transform:uppercase">'+
 '<button class="b g" onclick="mpJoin()">Dolacz / odswiez pokoj</button>'+

 '<p id=mst role=status style="overflow-wrap:anywhere;white-space:pre-line">'+escapeHtml(msg||(MPS.connected?'Połączono! Startuje mecz...':'Łączę z sygnalizacją...'))+'</p>'+
 '<p style="font-size:12px;opacity:.85">'+(location.protocol=='file:'?'Otwierasz plik z dysku. Możesz testować lokalnie, ale link dla kolegi wymaga opublikowania gry pod adresem HTTPS.':'Plik musi byc w internecie (https://), zeby link u kolegi dzialal.')+'</p></div>'+
 '<div class=cd><p><b>Tryb awaryjny</b> (gdy sieci blokuja brokerkow) \u2014 reczna wymiana dwoch kodow:</p>'+
 '<div class=row><button class="b g" onclick="rtcHost()">Stworz gre</button><button class="b g" onclick="rtcGuestUi()">Dolacz kodem</button></div></div>'+
 '<div class=cd><p><b>Serwer TURN</b> (opcjonalny, gdy polaczenie P2P nie przechodzi przez routery).<br>'+
 '<span style="font-size:12px;opacity:.85">Dane z Twojego panelu TURN: URL + username + credential. Zachowaj je prywatnie; mogą umożliwiać wykorzystanie limitu transferu.</span></p>'+
 '<input id=tu placeholder="turn:global.relay.metered.ca:80" value="'+escapeHtml((getTurn()||{}).u||'')+'" style="font-size:13px;padding:7px;border-radius:9px;width:100%;box-sizing:border-box;margin:3px 0">'+
 '<input id=tn placeholder="username" value="'+escapeHtml((getTurn()||{}).n||'')+'" style="font-size:13px;padding:7px;border-radius:9px;width:100%;box-sizing:border-box;margin:3px 0">'+
 '<input id=tc type=password autocomplete=off placeholder="credential" value="'+escapeHtml((getTurn()||{}).c||'')+'" style="font-size:13px;padding:7px;border-radius:9px;width:100%;box-sizing:border-box;margin:3px 0">'+
 '<button class="b g" onclick="setTurn()">Zapisz TURN</button>'+
 '<p style="font-size:12px;opacity:.85">Status: '+((getTurn()||{}).u?'własny TURN ustawiony (wymaga testu dostępności)':'brak własnego TURN — publiczne przekaźniki mogą nie działać')+'</p></div>'+
 '<button class="b g" onclick="menu()">Wst\u00f3c</button>'}
function mpMenu(){mpLeave();const _r=(crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('')).replace(/-/g,'').slice(0,10).toUpperCase();mpWaitPanel(_r,'');try{mpJoin(_r,1)}catch(e){window.__err='menu:'+e}}
function mpCopyLink(){const el=document.querySelector('#mc');
 const code=(el&&el.value||MPS.code||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);
 if(!code){mpSet('Najpierw wpisz kod pokoju.');return}
 const L=mpLink(code);let ok=0;
 try{if(navigator.clipboard){navigator.clipboard.writeText(L);ok=1}}catch(e){}
 mpSet('Link: '+L+(ok?' (skopiowany)':' \u2014 skopiuj recznie i wyslij koledze.'))}
function mpJoin(code,auto){
 code=(code==null?((document.querySelector('#mc')||{}).value||''):code).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);
 if(!code){mpSet('Podaj kod pokoju.');return}
 mpLeaveNet();MPS.myId=(crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('')).replace(/-/g,'').slice(0,16);MPS.sigSeq=0;MPS.code=code;MPS.started=0;MPS.ended=0;MPS.me=-1;MPS.connected=0;MPS.pcFail=0;MPS.peerId='';MPS.man=0;
 MPS.snap=null;MPS.rbl=[null,null];
 if(typeof WebSocket=='undefined'&&typeof EventSource=='undefined'){mpSet('Ta przegladarka nie obsluguje WebSocket/EventSource.');return}
 mpHello();clearInterval(MPS.hiT);MPS.hiT=setInterval(()=>{if(!MPS.connected&&MPS.sig&&MPS.sig.ok&&MPS.code==code)mpHello()},3000);
 clearInterval(MPS.ofT);MPS.ofT=setInterval(()=>{if(MPS.connected||MPS.code!=code)return;
  if(MPS.me==0&&MPS.peerId&&!MPS.pc)mpOffer();
  else if(MPS.me==0&&MPS.pc&&MPS.pc.localDescription&&!MPS.pc.remoteDescription)
   mpSig({k:'sdp',d:{type:'offer',sdp:MPS.pc.localDescription.sdp}})},2500);
 MPS.sig=sigStart(code,mpOnSignal,(up)=>{if(!MPS.sig||MPS.code!=code)return;
  if(up){mpHello();mpSet('W pokoju \u201e'+code+'\u201d. Czekam na drugiego gracza...')}
  else mpSet('Sygnalizacja rozlaczona \u2014 ponawiam...')});
 MPS.warnT=setTimeout(()=>{if(!MPS.connected&&MPS.code==code&&MPS.sig&&!MPS.sig.ok)
  mpSet('Nie moge dosiegnac serwera sygnalizacji (ntfy.sh / MQTT). Uzyj trybu awaryjnego (kody) nizej.')},12000);
 MPS.waitT=setTimeout(()=>{if(!MPS.connected&&MPS.code==code&&MPS.sig&&MPS.sig.ok&&!MPS.peerId)
  mpSet('Nikt nie wszedl do pokoju \u201e'+code+'\u201d. Wyslij koledze link: '+mpLink(code))},15000)}

const _boot=boot,MAN={on:0};

 if(MPS.pendingRoom){

 if(MPS.code&&!MPS.connected&&(!G||G.m!=8))mpWaitPanel(MPS.code,MPS.connected?'Polaczono!':'')};
window.__mp=()=>({sigUp:(MPS.sig&&MPS.sig.ok)?1:0,me:MPS.me,role:MPS.role,conn:MPS.connected,ping:MPS.ping,relay:MPS.relay,rx:MPS.rx,tx:MPS.tx,
 seq:MPS.seq,n:MPS.n,ph:G&&G.ph,rt:MPS.snap?MPS.snap.rt:0,code:MPS.code,
 bl:((G&&G.bl)||[]).map(o=>({id:o.b.id,x:Math.round(o.x*10)/10,y:Math.round(o.y*10)/10,hp:Math.round(o.hp),own:o.own?1:0}))});

/* ===== KONTA (lokalne: nick + hasło + zapis postępów w tej przeglądarce) ===== */
var ACC=null;
const ACI='bvb_acc',ACS='bvb_sess',KLEG='bvb2';
const accGet=()=>{try{return JSON.parse(localStorage.getItem(ACI))||{}}catch(e){return{}}};
const accPut=o=>{try{localStorage.setItem(ACI,JSON.stringify(o));return 1}catch(e){return 0}};
const accNorm=n=>String(n||'').normalize('NFC').trim().replace(/\s+/g,' ');
const accKey=n=>accNorm(n).toLowerCase();
const accB64=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const accUn=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function accHash(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,256))}
const accInp='style="font-size:16px;padding:8px;border-radius:10px;width:100%;box-sizing:border-box;margin:4px 0"';
const accMsg=t=>{const e=$('#accMsg');if(e)e.textContent=t};
function accShow(mode,msg){const n=Object.keys(accGet()).length;mode=mode||(n?'in':'up');let leg=0;try{leg=!!localStorage.getItem(KLEG)}catch(e){}
 $('#ov').hidden=false;
 $('#ovb').innerHTML=`<h2>${mode=='in'?'🔐 Zaloguj się':'✨ Załóż konto'}</h2><input id=accN maxlength=14 placeholder="Nick" autocomplete=username ${accInp}><input id=accP type=password placeholder="Hasło" autocomplete=${mode=='in'?'current-password':'new-password'} ${accInp} onkeydown="if(event.key=='Enter')${mode=='in'?'accLogin()':'accCreate()'}">${mode=='up'?`<input id=accP2 type=password placeholder="Powtórz hasło" autocomplete=new-password ${accInp}>${leg?'<label style="display:block;margin:6px 0"><input type=checkbox id=accM checked> Przenieś mój dotychczasowy postęp na to konto</label>':''}`:''}<p id=accMsg style="min-height:1.2em">${msg||''}</p><div class=row><button class=b onclick="${mode=='in'?'accLogin()':'accCreate()'}">${mode=='in'?'Zaloguj':'Utwórz konto'}</button><button class="b g" onclick="accShow('${mode=='in'?'up':'in'}')">${mode=='in'?'Nowe konto':'Mam konto'}</button></div><div class=row><button class="b g" onclick="accGuest()">Graj jako gość</button></div><p style="font-size:12px;opacity:.8">Konto i postęp są zapisane w tej przeglądarce na tym urządzeniu (nie na serwerze).</p>`}
async function accCreate(){
 if(!(window.crypto&&crypto.subtle)){accMsg('Ta przeglądarka nie pozwala na bezpieczne hasła (otwórz grę z pliku lub przez https).');return}
 const nick=accNorm($('#accN').value),pw=String($('#accP').value||''),pw2=$('#accP2')?String($('#accP2').value||''):pw;
 if(!/^[\p{L}\p{N}_ -]{3,14}$/u.test(nick)){accMsg('Nick: 3–14 znaków (litery, cyfry, spacja, _ lub -).');return}
 if(pw.length<4){accMsg('Hasło musi mieć co najmniej 4 znaki.');return}
 if(pw!==pw2){accMsg('Hasła nie są takie same.');return}
 const a=accGet(),k=accKey(nick);
 if(a[k]){accMsg('Nick „'+nick+'” jest już zajęty. Wybierz inny.');return}
 accMsg('Tworzę konto…');
 const salt=crypto.getRandomValues(new Uint8Array(16)),it=150000,h=await accHash(pw,salt,it);
 a[k]={n:nick,s:accB64(salt),h:accB64(h),i:it,t:Date.now()};
 if(!accPut(a)){accMsg('Nie mogę zapisać konta (przeglądarka blokuje pamięć lokalną?).');return}
 try{if($('#accM')&&$('#accM').checked){const old=localStorage.getItem(KLEG);if(old)localStorage.setItem('bvb2:u:'+k,old)}}catch(e){}
 accEnter(k)}
async function accLogin(){
 if(!(window.crypto&&crypto.subtle)){accMsg('Ta przeglądarka nie pozwala na bezpieczne hasła (otwórz grę z pliku lub przez https).');return}
 const k=accKey($('#accN').value),pw=String($('#accP').value||''),r=accGet()[k];
 if(!r){accMsg('Nie ma takiego konta na tym urządzeniu.');return}
 accMsg('Sprawdzam…');const h=await accHash(pw,accUn(r.s),r.i);
 if(accB64(h)!==r.h){await new Promise(x=>setTimeout(x,800));accMsg('Złe hasło.');return}
 accEnter(k)}
function accEnter(k){const r=accGet()[k];if(!r)return;ACC={k,n:r.n};K='bvb2:u:'+k;try{localStorage.setItem(ACS,k)}catch(e){}$('#ov').hidden=true;boot()}
function accGuest(){ACC=null;K=KLEG;try{localStorage.removeItem(ACS)}catch(e){}$('#ov').hidden=true;boot()}
function accOut(){try{localStorage.removeItem(ACS)}catch(e){}location.reload()}
function accInit(){let k=null;try{k=localStorage.getItem(ACS)}catch(e){}const r=k&&accGet()[k];if(r){ACC={k,n:r.n};K='bvb2:u:'+k;boot()}else accShow()}
function accPwUi(msg){$('#ov').hidden=false;$('#ovb').innerHTML=`<h2>Zmień hasło</h2><input id=accO type=password placeholder="Obecne hasło" ${accInp}><input id=accP type=password placeholder="Nowe hasło" ${accInp}><input id=accP2 type=password placeholder="Powtórz nowe hasło" ${accInp}><p id=accMsg>${msg||''}</p><div class=row><button class=b onclick="accPw()">Zmień</button><button class="b g" onclick="$('#ov').hidden=true">Anuluj</button></div>`}
async function accPw(){const a=accGet(),r=ACC&&a[ACC.k];if(!r)return;const p=String($('#accP').value||'');
 if(p.length<4){accMsg('Nowe hasło: min. 4 znaki.');return}if(p!==String($('#accP2').value||'')){accMsg('Nowe hasła się różnią.');return}
 const h=await accHash(String($('#accO').value||''),accUn(r.s),r.i);if(accB64(h)!==r.h){accMsg('Obecne hasło jest złe.');return}
 const salt=crypto.getRandomValues(new Uint8Array(16));r.s=accB64(salt);r.h=accB64(await accHash(p,salt,r.i));accPut(a);$('#ov').hidden=true}
function accDelUi(){$('#ov').hidden=false;$('#ovb').innerHTML=`<h2>Usunąć konto „${ACC.n}”?</h2><p>Skasujesz nick, hasło i cały postęp. Tego nie da się cofnąć.</p><input id=accO type=password placeholder="Hasło" ${accInp}><p id=accMsg></p><div class=row><button class="b g" onclick="accDel()">Usuń na zawsze</button><button class=b onclick="$('#ov').hidden=true">Anuluj</button></div>`}
async function accDel(){const a=accGet(),r=ACC&&a[ACC.k];if(!r)return;const h=await accHash(String($('#accO').value||''),accUn(r.s),r.i);if(accB64(h)!==r.h){accMsg('Złe hasło.');return}
 delete a[ACC.k];accPut(a);try{localStorage.removeItem('bvb2:u:'+ACC.k);localStorage.removeItem(ACS)}catch(e){}location.reload()}
function accBox(){return ACC?`<div class=cd>🔐 Konto: <b>${ACC.n}</b><br><span style="font-size:12px">Postęp zapisuje się automatycznie na tym urządzeniu. Na inne urządzenie przenosisz go przez Eksport/Import w Ustawieniach.</span><div class=row><button class="b g" onclick="accOut()">Wyloguj</button><button class="b g" onclick="accPwUi()">Zmień hasło</button><button class="b g" onclick="accDelUi()">Usuń konto</button></div></div>`:`<div class=cd>👤 Grasz jako gość (bez konta). <button class="b g" onclick="accOut()">Zaloguj / załóż konto</button></div>`}
/* nick konta jest zawsze nickiem w grze (także online); wczytanie i zapis go pilnują */
const _load2=load;load=function(){_load2();if(ACC&&S&&S.nm!==ACC.n){S.nm=ACC.n;save()}};
const _save2=save;save=function(){if(ACC&&S&&S.nm!==ACC.n)S.nm=ACC.n;_save2()};
if(MPS.pendingRoom&&!(function(){try{return localStorage.getItem('bvb_sess')}catch(e){return 0}})())accGuest();else accInit();
