<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball VS Ball — Wielki rework</title><style id="bvb-loading-css">
#bvb-loading-screen{position:fixed;inset:0;z-index:2147483647;background:#030816;color:#e6f5ff;display:grid;place-items:center;font:700 18px system-ui;text-align:center}
#bvb-loading-screen .scene{position:relative;width:min(100vw,177.777vh);aspect-ratio:16/9;background:#030816}
#bvb-loading-screen video{width:100%;height:100%;display:block;object-fit:contain}
#bvb-loading-screen .meter{position:absolute;bottom:0;left:0;right:0;height:20%;box-sizing:border-box;padding:1% 12%;background:#030816}
#bvb-loading-screen .track{height:10px;background:#15243b;border-radius:8px;overflow:hidden;margin:12px auto;width:70%}
#bvb-loading-fill{height:100%;width:0;background:linear-gradient(90deg,#3278ed,#77edff);transition:width .12s linear}
#bvb-loading-screen button{font:inherit;color:inherit;background:#244b7d;border:1px solid #75d6ff;border-radius:8px;padding:8px 18px}
@media(max-width:600px){#bvb-loading-screen{font-size:12px}.track{margin:5px auto!important;height:6px!important}}
</style></head><body><div id="bvb-loading-screen" role="dialog" aria-label="Ładowanie gry"><div class="scene"><video autoplay muted loop playsinline preload="auto" aria-hidden="true" src="rework/loading-intro.mp4"></video><div class="meter"><div id="bvb-loading-label" role="status">ŁADOWANIE GRY · 0%</div><div class="track" role="progressbar" aria-label="Postęp ładowania" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bvb-loading-fill"></div></div></div></div></div><script>
(function(){
  // Na telefonach używaj stabilnej, lekkiej wersji; pełny rework pozostaje pod ?full=1.
  var q = new URLSearchParams(location.search);
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (mobile && q.get('full') !== '1') {
    location.replace('./index-safe.html?v=20261101-5');
    return;
  }
  var script=document.createElement('script');
  script.src='./bvb-loader.js?v=20261101-2';
  script.onerror=function(){
    var label=document.getElementById('bvb-loading-label');
    if(label)label.textContent='Nie można uruchomić pełnej wersji';
    var btn=document.createElement('button');
    btn.textContent='Uruchom stabilną wersję';
    btn.onclick=function(){location.replace('./index-safe.html?v=20261101-5');};
    document.querySelector('#bvb-loading-screen .meter')?.append(btn);
  };
  document.body.appendChild(script);
})();
</script></body></html>
