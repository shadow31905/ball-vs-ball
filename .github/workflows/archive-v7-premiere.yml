name: Archive V7 Premiere MP4 in GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-v7-premiere.yml
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified 12-scene premiere with audio from temporary asset URL
        run: |
          python3 - <<'PY'
          import pathlib,re,urllib.request,subprocess,sys
          script=pathlib.Path("bvb-v7-premiere.js").read_text()
          m=re.search(r'const FILM=("https://[^"]+");',script)
          if not m:
              print("Premiere URL no longer present");sys.exit(1)
          import json
          url=json.loads(m.group(1))
          target=pathlib.Path("rework/v7-scenes-01-12.mp4")
          req=urllib.request.Request(url,headers={"User-Agent":"BVB-Release-Archive/1.0"})
          with urllib.request.urlopen(req,timeout=180) as resp, target.open("wb") as dst:
              import shutil
              shutil.copyfileobj(resp,dst,1024*1024)
          size=target.stat().st_size
          if not 29000000<size<35000000:
              print("Unexpected video size",size);sys.exit(1)
          check=subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type","-of","csv=p=0",str(target)],capture_output=True,text=True)
          if check.returncode!=0 or "video" not in check.stdout or "audio" not in check.stdout:
              print("Video/audio verification failed",check.stdout,check.stderr);sys.exit(1)
          script=script.replace(m.group(0),"const FILM='./rework/v7-scenes-01-12.mp4';")
          pathlib.Path("bvb-v7-premiere.js").write_text(script)
          print("Video archived and validated:",size,check.stdout.strip())
          PY
      - name: Publish permanent film file without changing game logic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rework/v7-scenes-01-12.mp4 bvb-v7-premiere.js
          git commit -m "Archive V7 scenes 1-12 premiere MP4 with stereo audio"
          git push origin HEAD:main
