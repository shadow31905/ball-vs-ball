name: Test and host offline first-sixteen beta
on:
  push:
    branches: [beta/original-first16-offline]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: first-sixteen-beta-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check offline roster and original menu
        env:
          BVB_BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/beta-server.log 2>&1 &
          node tests/first16-browser.cjs
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable-original
      - name: Package original site unchanged and beta under /beta/
        run: node scripts/build-hosting.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}beta/
    steps:
      - name: Refuse deployment if the original changed during testing
        run: |
          test "$(git ls-remote https://github.com/shadow31905/ball-vs-ball.git refs/heads/main | cut -f1)" = f1ce9dc1e4e9c2846323d44c2cf85d77f90708ae
      - name: Deploy original files unchanged plus isolated beta
        id: deployment
        uses: actions/deploy-pages@v4
