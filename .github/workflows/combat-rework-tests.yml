name: Combat rework regression tests

on:
  push:
    branches:
      - rework/combat-3-foundation
  pull_request:
    paths:
      - 'index.html'
      - 'bvb-combat-*.js'
      - 'bvb-abilities-v2.js'
      - 'bvb-anime-update.js'
      - 'tests/**'
      - '.github/workflows/combat-rework-tests.yml'

permissions:
  contents: read

jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check bvb-combat-rework.js
          node --check bvb-combat-ui.js
          node --check bvb-abilities-v2.js
          node --check bvb-anime-update.js
      - name: Run combat regression tests
        run: node --test tests/combat-rework.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run full-page Chromium smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bvb-server.log 2>&1 &
          sleep 2
          node tests/combat-browser-smoke.cjs
          node tests/combat-mobile-smoke.cjs
