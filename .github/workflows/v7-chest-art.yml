name: Extract approved V7 chest artwork
on:
  push:
    branches: [rework/menu-film-accurate-20261107]
    paths:
      - scripts/extract_chest_art.py
      - .github/workflows/v7-chest-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 imageio-ffmpeg==0.6.0
      - run: python scripts/extract_chest_art.py
      - name: Commit full chest assets to beta branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v7-chest-normal.webp assets/v7-chest-epic.webp assets/v7-chest-legend.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add complete V7 chest sprites extracted from approved film"
            git push origin HEAD:rework/menu-film-accurate-20261107
          fi
