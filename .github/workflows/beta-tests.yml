name: Test offline first-sixteen beta
on:
  push:
    branches: [beta/original-first16-offline]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: first-sixteen-beta-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check offline roster and original menu
        env:
          BVB_BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/beta-server.log 2>&1 &
          node tests/first16-browser.cjs
