name: V7 beta UI regression
on:
  push:
    branches: [test/v7-film-porownanie-2026-11-07]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated menu regression tests
        run: node tests/v7-ui-regression.cjs
