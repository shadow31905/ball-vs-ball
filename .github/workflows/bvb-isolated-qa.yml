name: BVB batch2 baseline before rework
on:
  push:
    branches: ['qa/batch2-id13-25-20261029']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BVB_EXPECTED_SHA256: eace90eaddc91e21ba5e5e9a5db97a2c35b1ad8221555bdf18ff611a79ba7263
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node inflate.cjs
      - run: node patch-006.cjs
      - run: node patch-007.cjs
      - run: node patch-040.cjs
      - run: node patch-041.cjs
      - run: node patch-042.cjs
      - run: node patch-043.cjs
      - run: node patch-044.cjs
      - run: npm install --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node patch-045.cjs
      - run: node patch-batch2.cjs
      - run: node test-batch2.cjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bvb-batch2-${{ matrix.browser }}
          path: evidence/
          retention-days: 7
