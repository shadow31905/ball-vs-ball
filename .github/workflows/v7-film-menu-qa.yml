name: V7 cinematic menu visual QA
on:
  push:
    branches: [rework/menu-film-accurate-20261107]
    paths:
      - bvb-menu-2-5.js
      - bvb-loader.js
      - index.html
      - 'assets/**'
      - tests/v7-film-menu-qa.cjs
      - .github/workflows/v7-film-menu-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: node --check bvb-menu-2-5.js
      - run: node tests/v7-film-menu-qa.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-menu-desktop-mobile
          path: tests/v7-menu-*.png
          if-no-files-found: ignore
