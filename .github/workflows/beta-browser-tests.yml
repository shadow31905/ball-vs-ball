name: Published beta browser smoke

on:
  push:
    branches: [main]
    paths:
      - 'beta/**'
      - '.github/workflows/beta-browser-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check beta script syntax
        run: |
          node --check beta/bvb-combat-rework.js
          node --check beta/bvb-combat-ui.js
          node --check beta/bvb-anime-update.js
          node --check beta/bvb-abilities-v2.js
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test the published beta page
        env:
          BVB_TEST_URL: http://127.0.0.1:8765/beta/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bvb-beta-server.log 2>&1 &
          sleep 2
          node beta/combat-browser-smoke.cjs
